<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: #102a43;
            background:
                linear-gradient(135deg, rgba(14, 116, 144, 0.96), rgba(15, 23, 42, 0.98)),
                #0f172a;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 560px;
            text-align: center;
            padding: 44px;
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 70px rgba(2, 12, 27, 0.35);
            animation: entrar 650ms ease-out both;
        }

        h1 {
            margin: 0;
            color: #0f766e;
            font-size: clamp(34px, 8vw, 52px);
            letter-spacing: -1px;
        }

        .subtitulo {
            max-width: 360px;
            margin: 12px auto 30px;
            color: #52606d;
            line-height: 1.6;
        }

        .campo-disciplina {
            width: 100%;
            margin-bottom: 4px;
            padding: 13px 14px;
            border: 1px solid #b2f5ea;
            border-radius: 10px;
            background: #f0fdfa;
            color: #115e59;
            font: inherit;
        }

        button {
            width: 100%;
            padding: 14px 18px;
            margin-top: 12px;
            border: 0;
            border-radius: 12px;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(245, 158, 11, 0.55);
            outline-offset: 3px;
        }

        .criar {
            background: #0f766e;
            color: white;
            box-shadow: 0 8px 18px rgba(15, 118, 110, 0.25);
        }

        .entrar {
            background: #e6fffa;
            color: #115e59;
        }

        .lobby {
            display: none;
            margin-top: 32px;
            padding: 28px 0 0;
            border-top: 1px solid #d9e2ec;
            animation: aparecer 450ms ease-out both;
        }

        .lobby h2 {
            margin: 0 0 6px;
            color: #102a43;
            font-size: 28px;
        }

        .lobby > div:not(.codigo-area) {
            color: #627d98;
            font-size: 14px;
        }

        .codigo-area {
            display: flex;
            gap: 8px;
            margin: 10px 0 18px;
        }

        .codigo-area input {
            min-width: 0;
            flex: 1;
            padding: 11px;
            border: 2px solid #b2f5ea;
            border-radius: 10px;
            background: #f0fdfa;
            color: #0f766e;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 4px;
            text-align: center;
        }

        .copiar {
            width: auto;
            margin-top: 0;
            padding: 10px 14px;
            background: #ffedd5;
            color: #c2410c;
        }

        .status-copia {
            align-self: center;
            min-width: 0;
            color: #0f766e;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .status-copia.visivel {
            opacity: 1;
        }

        #jogadores {
            display: grid;
            gap: 7px;
            padding: 0;
            list-style: none;
            color: #334e68;
        }

        #jogadores li {
            padding: 8px;
            border: 1px solid #d9e2ec;
            border-radius: 8px;
            background: #f8fafc;
            animation: aparecer 250ms ease-out both;
        }

        .quiz {
            display: none;
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid #d9e2ec;
            text-align: left;
            animation: aparecer 450ms ease-out both;
        }

        .quiz h2,
        .quiz h3 {
            text-align: center;
        }

        .quiz h2 {
            margin: 0 0 8px;
            color: #102a43;
        }

        .quiz h3 {
            margin: 0;
            color: #0f766e;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #contador {
            margin: 18px 0 8px;
            color: #829ab1;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        #pontuacao {
            margin: 0 0 18px;
            color: #c2410c;
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }

        #enunciado {
            margin: 0 0 18px;
            color: #243b53;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .alternativas {
            display: grid;
            gap: 8px;
        }

        .alternativa {
            margin-top: 0;
            border: 1px solid #d9e2ec;
            background: #f8fafc;
            color: #243b53;
            text-align: left;
        }

        .alternativa.correta {
            border-color: #4ade80;
            background: #dcfce7;
            color: #166534;
        }

        .alternativa.errada {
            border-color: #f87171;
            background: #fee2e2;
            color: #991b1b;
        }

        .proxima {
            background: #f59e0b;
            color: white;
        }

        .sair {
            margin-top: 16px;
            background: transparent;
            border: 1px solid #fca5a5;
            color: #b91c1c;
        }

        .inicio-novo {
            margin-top: 10px;
            background: transparent;
            color: #627d98;
            font-size: 13px;
        }

        .resultado {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border-radius: 14px;
            background: #f0fdfa;
            border: 1px solid #99f6e4;
            text-align: center;
            animation: aparecer 450ms ease-out both;
        }

        .resultado h3 {
            margin: 0 0 8px;
            color: #0f766e;
        }

        .resultado strong {
            color: #c2410c;
            font-size: 28px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        @keyframes entrar {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 520px) {
            body {
                padding: 16px 10px;
            }

            .container {
                width: 100%;
                padding: 30px 22px;
                border-radius: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <section id="inicio">
        <h1>QuizConnect</h1>

        <p class="subtitulo">Desafie seus conhecimentos de Análise e Desenvolvimento de Sistemas.</p>

        <select class="campo-disciplina" id="disciplinaSelecionada" aria-label="Escolha a disciplina">
            <option value="Todas">Todas as disciplinas</option>
            <option value="Programação">Programação</option>
            <option value="Banco de Dados">Banco de Dados</option>
            <option value="Engenharia de Software">Engenharia de Software</option>
            <option value="Redes de Computadores">Redes de Computadores</option>
            <option value="Sistemas Operacionais">Sistemas Operacionais</option>
            <option value="Algoritmos e Programação Estruturada">Algoritmos e Programação Estruturada</option>
            <option value="Linguagem Orientada a Objetos">Linguagem Orientada a Objetos</option>
            <option value="Programação Web">Programação Web</option>
            <option value="Sistemas Distribuídos">Sistemas Distribuídos</option>
            <option value="Desenvolvimento Mobile">Desenvolvimento Mobile</option>
            <option value="Computação em Nuvem">Computação em Nuvem</option>
        </select>

        <button class="criar" onclick="criarSala()">
            Criar Sala
        </button>

        <button class="entrar" onclick="entrarSala()">
            Entrar em uma Sala
        </button>
    </section>

    <section class="lobby" id="lobby">
        <h2>Lobby</h2>
        <div id="disciplinaSala"></div>
        <div>Código da sala</div>
        <div class="codigo-area">
            <input id="codigoSala" type="text" readonly aria-label="Código da sala">
            <button class="copiar" onclick="copiarCodigo()">Copiar</button>
            <span class="status-copia" id="statusCopia" role="status"></span>
        </div>
        <p>Jogadores conectados</p>
        <ul id="jogadores"></ul>
        <button class="criar" id="botaoIniciarQuiz" onclick="iniciarQuiz()">Iniciar Quiz</button>
        <button class="inicio-novo" onclick="voltarInicio()">Voltar à página inicial</button>
    </section>

    <section class="quiz" id="quiz">
        <h2>Quiz de ADS</h2>
        <h3 id="disciplina"></h3>
        <p id="contador"></p>
        <p id="pontuacao">Pontuação: 0</p>
        <p id="enunciado"></p>
        <div class="alternativas" id="alternativas"></div>
        <button class="proxima" id="proxima" onclick="proximaPergunta()" disabled>Próxima</button>
        <div class="resultado" id="resultado">
            <h3>Ranking da partida</h3>
            <div id="resultadoTexto"></div>
        </div>
        <button class="sair" onclick="sairDoQuiz()">Sair do Quiz</button>
    </section>

</div>

<script>

    async function criarSala() {
        try {
            const disciplina = document.getElementById('disciplinaSelecionada').value;
            const resposta = await fetch('/api/salas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ disciplina: disciplina })
            });

            if (!resposta.ok) {
                throw new Error('Falha ao criar a sala');
            }

            const dados = await resposta.json();
            mostrarLobby(dados.codigo, dados.disciplina);
        } catch (erro) {
            console.error(erro);
            alert("Não foi possível criar a sala.");
        }
    }

    async function entrarSala() {
        const codigo = prompt("Digite o código da sala:");
        const nome = prompt("Digite seu nome:");

        if (!codigo || !nome) {
            alert("Código e nome são obrigatórios.");
            return;
        }

        try {
            const resposta = await fetch('/api/salas/entrar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    codigo: codigo,
                    nome: nome
                })
            });

            const dados = await resposta.json();

            if (!resposta.ok) {
                throw new Error(dados.mensagem || 'Erro ao entrar na sala');
            }

            alert("Entrou com sucesso!\n" + dados.mensagem);
            mostrarLobby(dados.codigo, dados.disciplina);
        } catch (erro) {
            console.error(erro);
            alert(erro.message);
        }
    }

    function mostrarLobby(codigo, disciplina) {
        // Troca a tela inicial pelo lobby da sala atual.
        document.getElementById('inicio').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('codigoSala').value = codigo;
        disciplinaDaSala = disciplina || '';
        document.getElementById('disciplinaSala').textContent = disciplina || 'Quiz geral';
        atualizarLobby(codigo);

        setInterval(() => atualizarLobby(codigo), 3000);
    }

    async function copiarCodigo() {
        const campoCodigo = document.getElementById('codigoSala');
        const status = document.getElementById('statusCopia');
        campoCodigo.select();
        await navigator.clipboard.writeText(campoCodigo.value);
        status.textContent = 'Copiado';
        status.classList.add('visivel');
        setTimeout(() => status.classList.remove('visivel'), 1800);
    }

    async function atualizarLobby(codigo) {
        try {
            const resposta = await fetch('/api/salas/' + encodeURIComponent(codigo));

            if (!resposta.ok) {
                return;
            }

            const dados = await resposta.json();
            const lista = document.getElementById('jogadores');
            lista.innerHTML = '';

            dados.jogadores.forEach(nome => {
                const jogador = document.createElement('li');
                jogador.textContent = nome;
                lista.appendChild(jogador);
            });
        } catch (erro) {
            console.error('Não foi possível atualizar o lobby.', erro);
        }
    }

    let perguntas = [];
    let perguntaAtual = 0;
    let pontuacao = 0;
    let audioContext;
    let quizFinalizado = false;
    let disciplinaDaSala = '';

    async function iniciarQuiz() {
        try {
            // Cada jogador recebe sua propria ordem de perguntas e alternativas.
            const resposta = await fetch('/api/perguntas?disciplina=' + encodeURIComponent(disciplinaDaSala));

            if (!resposta.ok) {
                throw new Error('Não foi possível carregar as perguntas.');
            }

            perguntas = await resposta.json();

            if (perguntas.length === 0) {
                alert('Ainda não há perguntas cadastradas para esta disciplina.');
                return;
            }

            perguntaAtual = 0;
            pontuacao = 0;
            quizFinalizado = false;
            document.getElementById('pontuacao').textContent = 'Pontuação: 0';
            document.getElementById('resultado').style.display = 'none';
            document.getElementById('botaoIniciarQuiz').style.display = 'none';
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            mostrarPergunta();
        } catch (erro) {
            alert(erro.message);
        }
    }

    function mostrarPergunta() {
        const pergunta = perguntas[perguntaAtual];
        document.getElementById('disciplina').textContent = pergunta.disciplina;
        document.getElementById('contador').textContent =
            'Pergunta ' + (perguntaAtual + 1) + ' de ' + perguntas.length;
        document.getElementById('enunciado').textContent = pergunta.enunciado;

        const alternativas = document.getElementById('alternativas');
        alternativas.innerHTML = '';
        document.getElementById('proxima').disabled = true;

        pergunta.alternativas.forEach(alternativa => {
            const botao = document.createElement('button');
            botao.className = 'alternativa';
            botao.textContent = alternativa;
            botao.onclick = () => selecionarAlternativa(botao);
            alternativas.appendChild(botao);
        });
    }

    async function selecionarAlternativa(botaoSelecionado) {
        // A resposta e validada no backend para manter o gabarito protegido.
        const pergunta = perguntas[perguntaAtual];
        const botoes = document.querySelectorAll('.alternativa');

        botoes.forEach(botao => botao.disabled = true);

        try {
            const resposta = await fetch('/api/perguntas/' + pergunta.id + '/responder', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ resposta: botaoSelecionado.textContent })
            });

            const resultado = await resposta.json();

            if (resultado.correta) {
                botaoSelecionado.classList.add('correta');
                pontuacao += 1;
                document.getElementById('pontuacao').textContent = 'Pontuação: ' + pontuacao;
                tocarSom(true);
            } else {
                botaoSelecionado.classList.add('errada');
                botoes.forEach(botao => {
                    if (botao.textContent === resultado.respostaCorreta) {
                        botao.classList.add('correta');
                    }
                });
                tocarSom(false);
            }

            document.getElementById('proxima').disabled = false;
        } catch (erro) {
            botoes.forEach(botao => botao.disabled = false);
            alert('Não foi possível verificar a resposta.');
        }
    }

    function tocarSom(acertou) {
        audioContext = audioContext || new AudioContext();
        const oscilador = audioContext.createOscillator();
        const ganho = audioContext.createGain();
        const agora = audioContext.currentTime;

        oscilador.type = 'sine';
        oscilador.frequency.setValueAtTime(acertou ? 660 : 220, agora);
        oscilador.frequency.exponentialRampToValueAtTime(acertou ? 880 : 150, agora + 0.16);
        ganho.gain.setValueAtTime(0.0001, agora);
        ganho.gain.exponentialRampToValueAtTime(0.16, agora + 0.02);
        ganho.gain.exponentialRampToValueAtTime(0.0001, agora + 0.2);

        oscilador.connect(ganho);
        ganho.connect(audioContext.destination);
        oscilador.start(agora);
        oscilador.stop(agora + 0.2);
    }

    function proximaPergunta() {
        if (perguntaAtual === perguntas.length - 1) {
            quizFinalizado = true;
            document.getElementById('proxima').disabled = true;
            document.getElementById('resultadoTexto').innerHTML =
                'Jogador atual<br><strong>' + pontuacao + ' / ' + perguntas.length + '</strong>';
            document.getElementById('resultado').style.display = 'block';
            tocarMusicaFinal();
            return;
        }

        perguntaAtual += 1;
        mostrarPergunta();
    }

    function sairDoQuiz() {
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        document.getElementById('botaoIniciarQuiz').style.display = 'block';
        perguntas = [];
        perguntaAtual = 0;
        pontuacao = 0;
        quizFinalizado = false;
    }

    function voltarInicio() {
        // Limpa o estado da tela sem reiniciar o servidor.
        document.getElementById('quiz').style.display = 'none';
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('inicio').style.display = 'block';
        document.getElementById('codigoSala').value = '';
        document.getElementById('jogadores').innerHTML = '';
        perguntas = [];
        perguntaAtual = 0;
        pontuacao = 0;
        disciplinaDaSala = '';
    }

    function tocarMusicaFinal() {
        audioContext = audioContext || new AudioContext();
        const notas = [523.25, 659.25, 783.99, 1046.5];
        const agora = audioContext.currentTime;

        notas.forEach((frequencia, indice) => {
            const oscilador = audioContext.createOscillator();
            const ganho = audioContext.createGain();
            const inicio = agora + indice * 0.16;

            oscilador.type = 'sine';
            oscilador.frequency.value = frequencia;
            ganho.gain.setValueAtTime(0.0001, inicio);
            ganho.gain.exponentialRampToValueAtTime(0.14, inicio + 0.03);
            ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + 0.22);
            oscilador.connect(ganho);
            ganho.connect(audioContext.destination);
            oscilador.start(inicio);
            oscilador.stop(inicio + 0.22);
        });
    }

</script>
